<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 닉네임 입력 화면 -->
      <div id="nickname-screen" class="screen"></div>

      <!-- 시작 화면(게임 방법/게임 시작) -->
      <div id="start-screen" class="screen"></div>

      <!-- 게임 설명 -->
      <div id="howToPlay-screen" class="screen"></div>

      <!-- 메인 게임 화면 -->
      <div id="game-screen" class="screen"></div>

      <!-- 게임 종료 화면 -->
      <div id="gameover-screen" class="screen"></div>
    </div>

    <script src="../js/main.mjs" type="module"></script>
  </body>
</html>
