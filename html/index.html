<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/startPage.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div>
      <!-- 닉네임 입력 화면 -->
      <div id="nickname-screen" class="screen active">
        <img
          class="background"
          src="../assets/main_background.svg"
          alt="background"
        />
        <img id="game-name" src="../assets/game_name.svg" alt="" />
        <input
          id="input-nickname"
          class="start-page-input"
          type="text"
          placeholder="닉네임을 입력하세요"
        />
        <button id="nickname-start-btn" class="start-page-btn">시작</button>
      </div>
    </div>
    <script src="../js/nickname.js" type="module"></script>
  </body>
</html>
