<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/howToPlay.css" />
  </head>
  <body>
    <div>
      <!-- 게임 설명 -->
      <div id="howToPlay-screen" class="screen active">
        <img class="background" src="../assets/default_background.svg" alt="" />
        <div id="explanation">
          <p>1. 손님의 주문을 확인한다</p>
          <p class="detail">
            게임이 시작되면 손님의 주문이 나타난다. 손님이 원하는 김밥 종류와
            필요한 재료를 확인한다.
          </p>
          <p>2. 재료를 조리대에 넣어 김밥을 만든다.</p>
          <p class="detail">
            원하는 재료를 마우스로 드래그하여 조리대에 가져다 놓는다. 김밥은
            반드시 김 → 밥 → 추가 재료 순서로 만들어야 한다.
          </p>
          <p>3. 완성한 김밥을 드래그하여 카운터에 제출한다.</p>
          <p>4. 정확히 만들면 수익을 얻는다.</p>
          <p class="detail">
            재료가 빠졌거나 잘못 들어간 경우에는 오류 개수에 따라 수익이
            줄어든다.
          </p>
        </div>
        <button
          id="howtoplay-start-btn"
          class="howToPlay-page-btn"
          onclick="location.href = 'game.html'"
        >
          시작
        </button>
      </div>
    </div>
  </body>
</html>
