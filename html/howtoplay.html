<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/howToPlay.css" />
  </head>
  <body>
    <div>
      <!-- 게임 설명 -->
      <div id="howtoplay-screen" class="screen title-screen">
        <img class="background" src="../assets/default_background.svg" alt="" />
        <div class="htp-card">
          <div class="htp-title">김밥 만드는 방법</div>
          <div class="htp-steps">
            <div class="htp-step">
              <img src="../assets/tools/gim-stack.svg" alt="" /><b
                >1. 김 깔기</b
              >
              <p>김을 도마로 끌어다 놓기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/tools/cooker-body.svg" alt="" /><b
                >2. 밥 푸기</b
              >
              <p>주걱으로 밥을 퍼서 김 위에 놓기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/ingredients/carrot.svg" alt="" /><b
                >3. 재료 올리기</b
              >
              <p>말풍선에 적힌 재료만 올려놓기</p>
            </div>
            <div class="htp-step">
              <img class="step-pic" src="../assets/icons/swirl.svg" alt="" /><b
                >4. 돌돌 말기</b
              >
              <p>도마를 위로 쓸어 올리기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/tools/knife.svg" alt="" /><b>5. 자르기</b>
              <p>자르기 버튼을 눌러 김밥 자르기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/tools/plate.svg" alt="" /><b>6. 서빙</b>
              <p>접시를 손님에게 끌어다 주기</p>
            </div>
          </div>
          <div class="htp-tips">
            <div>
              <b
                ><img class="ico" src="../assets/icons/heart.svg" alt="" />
                단골</b
              >
              더 오래 기다려 줘요
            </div>
            <div>
              <b
                ><img class="ico" src="../assets/icons/fire.svg" alt="" />
                콤보</b
              >
              PERFECT 연속 보너스
            </div>
            <div>
              <b
                ><img class="ico" src="../assets/icons/party.svg" alt="" /> 피버
                타임</b
              >
              마지막 25초 1.5배
            </div>
          </div>
          <div class="htp-buttons">
            <button
              id="back-btn"
              class="btn secondary"
              onclick="location.href = 'startgame.html'"
            >
              뒤로
            </button>
            <button
              id="start-btn"
              class="btn"
              onclick="location.href = 'game.html'"
            >
              바로 시작!
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
