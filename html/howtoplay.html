<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/howToPlay.css" />
  </head>
  <body>
    <div>
      <!-- 게임 설명 -->
      <div id="howtoplay-screen" class="screen title-screen">
        <img class="background" src="../assets/default_background.svg" alt="" />
        <div class="htp-card">
          <div class="htp-title">김밥 만드는 방법</div>
          <div class="htp-steps">
            <div class="htp-step">
              <img src="../assets/tools/gim-stack.svg" alt="" /><b
                >1. 김 깔기</b
              >
              <p>김을 도마로 끌어다 놓기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/tools/cooker-body.svg" alt="" /><b
                >2. 밥 푸기</b
              >
              <p>밥솥을 누른 채 김 위로 끌어 펼치기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/ingredients/carrot.svg" alt="" /><b
                >3. 재료 올리기</b
              >
              <p>말풍선에 적힌 재료만 올려놓기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/tools/knife.svg" alt="" /><b>4. 말고 자르기</b>
              <p>도마를 더블클릭해 말고, 자르기 버튼 누르기</p>
            </div>
            <div class="htp-step">
              <img src="../assets/board/roll.svg" alt="" /><b>5. 서빙</b>
              <p>자른 김밥을 손님에게 끌어다 주기</p>
            </div>
          </div>
          <div class="htp-buttons">
            <button
              id="back-btn"
              class="btn secondary"
              onclick="location.href = 'startgame.html'"
            >
              뒤로
            </button>
            <button
              id="start-btn"
              class="btn"
              onclick="location.href = 'game.html'"
            >
              바로 시작!
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
