<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/gameScreen.css" />
  </head>
  <body>
    <div>
      <!-- 메인 게임 화면 -->
      <div id="game-screen" class="screen active">
        <img class="background" src="../assets/main_background.svg" alt="" />
        <div id="game-header">
          <div class="header-box">
            <img src="../assets/timer.svg" alt="" />
            <span id="timer-value">60</span>초
          </div>
          <div class="header-box">
            <img src="../assets/profit.svg" alt="" />
            수익: <span id="profit-value">0</span>원
          </div>
        </div>

        <div id="customer-area">
          <img id="customer-image" src="" alt="손님" />
          <div id="order-bubble">
            <p id="order-text"></p>
            <p id="order-ingredients"></p>
          </div>
        </div>

        <div id="workspace">
          <!-- 카운터: 완성한 김밥을 제출하는 드롭존 -->
          <div id="counter" class="dropzone">
            <img class="dropzone-bg" src="../assets/counter.svg" alt="" />
          </div>

          <div id="ingredient-panel">
            <img src="../assets/ingredient-list.svg" alt="" />
            <!-- 재료 목록(토핑): main.mjs가 data/ingredients.js로부터 렌더링 -->
            <div id="ingredient-list"></div>

            <!-- 기본 재료(김, 밥): main.mjs가 data/ingredients.js로부터 렌더링 -->
            <div id="base-ingredients"></div>

            <!-- 조리대: 재료를 순서대로 쌓는 드롭존 -->
            <div id="cutting-board" class="dropzone" draggable="true">
              <img
                class="dropzone-bg"
                src="../assets/cutting-board.svg"
                alt=""
              />
              <div class="board-items"></div>
            </div>
          </div>

          <!-- 쓰레기통: 만들던 김밥을 폐기하는 드롭존 -->
          <div id="trash-can" class="dropzone">
            <img class="dropzone-bg" src="../assets/trash-can.svg" alt="" />
          </div>
        </div>
      </div>
    </div>

    <script src="../js/main.mjs" type="module"></script>
  </body>
</html>
