<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김밥말아</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/endGame.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div>
      <!-- 게임 종료 화면 -->
      <div id="gameover-screen" class="screen active">
        <img class="background" src="../assets/default_background.svg" alt="" />

        <!-- 왼쪽(결과) -->
        <div id="result-panel" class="panel">
          <div class="panel-title">오늘의 영업 결과</div>
          <div id="stars"></div>
          <div id="final-profit"><b id="profit-won">0</b>원</div>
          <div id="grade-line"></div>
          <div class="stat-grid">
            <div class="stat">
              <div class="stat-icon">😍</div>
              <div class="stat-num" id="happy-count">0</div>
              <div class="stat-label">만족한 손님</div>
            </div>
            <div class="stat">
              <div class="stat-icon">😡</div>
              <div class="stat-num" id="angry-count">0</div>
              <div class="stat-label">화난 손님</div>
            </div>
          </div>
        </div>

        <!-- 오른쪽(랭킹) -->
        <div id="ranking-panel" class="panel">
          <div id="ranking-title">RANKING</div>
          <ul id="ranking-list"></ul>
          <div class="end-buttons">
            <button class="btn" onclick="location.href = 'game.html'">
              한 판 더!
            </button>
            <button
              class="btn secondary"
              onclick="location.href = 'startgame.html'"
            >
              처음으로
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/endgame.js" type="module"></script>
  </body>
</html>
